name: Dependabot Changeset

on:
  pull_request:
    # Workspace manifests only: the root package.json holds dev tooling that
    # never reaches the production image, so those bumps get no release.
    paths:
      - 'apps/*/package.json'
      - 'packages/*/package.json'

permissions:
  contents: write

jobs:
  changeset:
    name: Add changeset
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Write changeset
        id: changeset
        uses: actions/github-script@v8
        with:
          script: |
            const { promises: fs } = require('fs');

            const { stdout: diff } = await exec.getExecOutput('git', ['diff', '--name-only', 'HEAD~1']);
            if (diff.split('\n').some((f) => f.startsWith('.changeset/'))) {
              core.info('Changeset already present, nothing to do');
              return;
            }

            const { stdout: sha } = await exec.getExecOutput('git', ['rev-parse', '--short', 'HEAD']);
            const { stdout: subject } = await exec.getExecOutput('git', ['show', '-s', '--pretty=format:%s', 'HEAD']);
            const summary = subject.trim().replace(/^chore\(deps(-dev)?\):\s*/, '');

            const file = `.changeset/dependabot-${sha.trim()}.md`;
            await fs.writeFile(file, `---\n'wan-monitor': patch\n---\n\n${summary}\n`);
            await exec.exec('git', ['add', file]);
            core.setOutput('created', 'true');

      # Amended into dependabot's commit so the branch stays one commit, and
      # pushed with GITHUB_TOKEN, which does not retrigger this workflow.
      - name: Commit and push
        if: steps.changeset.outputs.created == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -C HEAD --amend --no-edit --no-verify
          git push --force
