version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # no-changeset exempts dependency bumps from the changeset-check gate -
    # they don't carry release notes of their own.
    labels:
      - "dependencies"
      - "no-changeset"
    groups:
      # Effect ecosystem, including foldkit - foldkit and @foldkit/* peer-pin
      # an exact effect beta version, so they move together. No update-types
      # filter: prerelease bumps (e.g. beta.102 -> beta.103) aren't "minor" or
      # "patch", so that filter would silently exclude them from the group.
      effect:
        patterns:
          - "effect"
          - "@effect/*"
          - "foldkit"
          - "@foldkit/*"

      # React ecosystem - ignore major versions
      react:
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"

      # Chakra UI and emotion - group together, ignore major versions
      chakra-ui:
        patterns:
          - "@chakra-ui/*"
          - "@emotion/*"
          - "framer-motion"
        update-types:
          - "minor"
          - "patch"

      # Testing libraries - ignore major versions
      # vitest and @vitest/* are excluded from this group: apps/web runs vitest 4
      # while the rest of the workspace runs vitest 3, so a grouped update would
      # resolve to one shared version and downgrade or upgrade across a major
      # boundary in whichever manifest doesn't match. Left ungrouped, each
      # manifest gets its own PR that respects its own major-version ignore rule.
      testing:
        patterns:
          - "@testing-library/*"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"

      # Build tools - ignore Vite major versions
      build-tools:
        patterns:
          - "vite"
          - "tsup"
          - "tsx"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"

      # Backend framework - ignore Fastify major versions
      backend:
        patterns:
          - "fastify"
          - "@fastify/*"
        update-types:
          - "minor"
          - "patch"

      # Database clients
      database:
        patterns:
          - "pg"
          - "@types/pg"
          - "@questdb/*"

      # Changesets - the CLI and its changelog plugin are versioned
      # together upstream and the release workflow pins changesets/action to
      # a matching major, so they have to move as one PR. No update-types
      # filter: their majors ship in lockstep too.
      changesets:
        patterns:
          - "@changesets/*"

      # Development tools
      dev-tools:
        patterns:
          - "@biomejs/*"
          - "husky"
          - "lint-staged"
          - "pino"
          - "pino-pretty"

      # TypeScript and type definitions - ignore major versions
      # (@types/node major is pinned to match the project's Node version)
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      # Other utilities - ignore major versions (recharts v3 needs a manual migration)
      utilities:
        patterns:
          - "dotenv"
          - "react-icons"
          - "recharts"
          - "@tanstack/react-query"
          - "ping"
          - "@types/ping"
        update-types:
          - "minor"
          - "patch"

    # Ignore major version updates for packages that require significant refactoring
    ignore:
      # Effect ecosystem major versions
      - dependency-name: "effect"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@effect/platform"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@effect/platform-node"
        update-types: ["version-update:semver-major"]

      # React major versions
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

      # Build tools major versions
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

      # Backend major versions
      - dependency-name: "fastify"
        update-types: ["version-update:semver-major"]

      # TypeScript major versions - each major carries breaking tsconfig
      # default changes and compiler-API compatibility shifts (e.g. TS 7's
      # native Go compiler shipped without a stable API), so bump manually.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # @types/node major is pinned to the project's Node runtime (Node 24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # Vite plugin major versions (tied to Vite major, which is also ignored)
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

      # Chakra UI / emotion / framer-motion major versions (Chakra v3 is a full API rewrite)
      - dependency-name: "@chakra-ui/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@emotion/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "framer-motion"
        update-types: ["version-update:semver-major"]

      # Testing library major versions (testing-library 16, jsdom 27 need manual migration)
      # vitest itself is fully excluded below: apps/web runs vitest 4 while the
      # rest of the workspace runs vitest 3, and dependabot resolves "vitest" as
      # one dependency across the whole pnpm workspace regardless of grouping,
      # so any automated bump forces both sides onto the same version and
      # downgrades or upgrades one of them across a major boundary. Bump it
      # manually, one manifest at a time, instead.
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

      # @effect/vitest beta.103+ requires vitest ^4.1.0, but root and
      # apps/server still run vitest ^3.2.x. Fully excluded (no update-types):
      # its beta-to-beta bumps are prerelease, not semver-minor/patch.
      - dependency-name: "@effect/vitest"
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

      # Charting library major versions (recharts v3 needs a manual migration)
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]

      # Pinned version due to patch
      - dependency-name: "speedtest-net"
        versions: [">2.2.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # no-changeset exempts dependency bumps from the changeset-check gate -
    # they don't carry release notes of their own.
    labels:
      - "dependencies"
      - "no-changeset"
    # Group all GitHub Actions bumps into a single PR to avoid the
    # cross-conflict churn of one PR per action touching the same workflow files
    groups:
      github-actions:
        patterns:
          - "*"
